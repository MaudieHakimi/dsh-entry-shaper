# dsh-entry-shaper bundle patch：把插件行插入宿主插件树
# 本插件**不接管 compaction 服务**（因此不需要 disable 任何官方行），可与官方
# dsh-compaction-basic、dsh-context-slimmer 共存。
- insert:
    - id: dsh-entry-shaper
      name: dsh-entry-shaper
      config:
        # ⛔ 紧急关闭（2026-09-23）：行为分歧基准发现，在 thinking 模式下用**真实多轮历史**
        # 发请求时，缺 reasoning_content 会被 API 拒绝：
        #   "The `reasoning_content` in the thinking mode must be passed back to the API."
        # 单轮探针（1 轮工具往返）曾返回 200，属于特例，不能代表真实会话。
        # 规则边界正在用 bench/passback-rule.mjs 定位；在定论之前不要打开。
        enabled: false
        # 当前唯一实现的塑形动作：处理 assistant/message 里的 reasoning 块
        dropReasoning: true
        # extract（默认，决策抽取：只留"我打算/下一步"那类句子）| stub（短桩）| drop（会被 400）
        reasoningMode: extract
        extractMaxChars: 240
        # 替换事件不带 usage（meter 按事件折算 usage，复制会翻倍）。
        # 若实测发现统计丢失（说明它按表面折算），改为 false。
        dropUsageOnReplace: true
        # 统计与自证写 ~/.dsh-entry-shaper.log
        logStats: true
