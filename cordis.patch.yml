# dsh-entry-shaper bundle patch
#
# ⚠️ **本文件必须保持"纯 insert"**：`dshmarket/lib/hot.js:295` 明确规定
#    「bundle patch 含配置行/表达式 ⇒ 不能热挂载，只能重启生效」。
#    所以这里**不能写 config:**（否则本插件永远无法被市场/`dsh plugin add` 热挂载 ✗）。
#
# 可调项全部放在**运行时热读**的配置文件里（改完立即生效，不需要重启）：
#    ~/.dsh-entry-shaper.config.json   ← 内容与下面的示例同形
# 三个开关层次：
#    ① 本 patch 的 insert（是否挂载；改它需重启 ✗）
#    ② 用户层 `- id: dsh-entry-shaper / disabled: true|false`（最后应用；改它需重启 ✗）
#    ③ 运行时可热改：配置文件（enabled / policy / proxy / cache / opTimeoutMs …）✓
#       以及免重启急刹：在用户主目录建空文件 ~/.dsh-entry-shaper.OFF ✓
#
# ~/.dsh-entry-shaper.config.json 示例：
# {
#   "enabled": true,
#   "shapeReasoning": true,        ← 旧名 "dropReasoning" 仍被 mergeCfg() 兼容，但请用新名
#   "policy": {
#     "reasoning":  { "ops": [{ "op": "extract", "maxChars": 240 }] },
#     "toolResult": { "ops": [{ "op": "keep" }] },
#     "toolArgs":   { "ops": [{ "op": "keep" }] },
#     "assistantText": { "ops": [{ "op": "keep" }] }
#   },
#   "cache": { "enabled": true, "maxBytes": 8388608, "maxEntryChars": 16384 },
#   "proxy": { "enabled": false, "provider": "deepseek-shaped", "upstream": "deepseek-official" },
#   "opTimeoutMs": 8000,
#   "lagWarnMs": 2000
# }
# 全部可调键以 index.js 的 DEFAULTS 为准（配置文件按 mtime 热读）。
#
# 本插件不接管任何服务（不 provide），因此**不需要** disable 别的行 ✓。
- insert:
    - id: dsh-entry-shaper
      name: dsh-entry-shaper
