# dsh-entry-shaper bundle patch：把插件行插入宿主插件树
# 本插件**不接管 compaction 服务**（因此不需要 disable 任何官方行），可与官方
# dsh-compaction-basic、dsh-context-slimmer 共存。
- insert:
    - id: dsh-entry-shaper
      name: dsh-entry-shaper
      config:
        # 打开（依据：DSH 本来就是"两份存"——表面折叠 replace 供模型使用，
        # 而人类转录/界面只读 append-origin 事件：core/session/src/surface.ts:40-68、
        # host/apiproxy/src/api-proxy.ts:218-227 "Replacement copies never entered the
        # conversation a reader sees … they consume no quota"）。
        enabled: true
        # 当前唯一实现的塑形动作：摘掉 assistant/message 里的 reasoning 块
        dropReasoning: true
        # 替换事件不带 usage（meter 按事件折算 usage，复制会翻倍）。
        # 若实测发现统计丢失（说明它按表面折算），改为 false。
        dropUsageOnReplace: true
        # 统计与自证写 ~/.dsh-entry-shaper.log
        logStats: true
