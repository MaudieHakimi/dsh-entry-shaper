# CI：语法检查 + 自测（无依赖、无网络）
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 语法检查
        run: |
          node --check index.js
          node --check test/shaping.test.mjs
      - name: 自测（同进程聚合器）
        run: node test/run-all.mjs
      - name: 自测（node --test）
        run: node --test test/
      - name: 元文件可解析
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"
